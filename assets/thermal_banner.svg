<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Thermal infrared perception</title>
  <desc id="desc">Abstract thermal field and target reticle in a dark blue and cyan visual style.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="0.55" stop-color="#0b1c32"/>
      <stop offset="1" stop-color="#10152c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="heat" cx="50%" cy="50%" r="50%">
