<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">DMCT learned low-high frequency decomposition</title>
  <desc id="desc">A thermal image enters a learned decomposition module and separates into smooth low-frequency structure and high-frequency detail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="0.55" stop-color="#0b1c32"/>
      <stop offset="1" stop-color="#11152b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#67e8f9"/>
    </marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9cc8ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1440" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="360" rx="28" fill="url(#grid)"/>
  <rect width="7" height="360" rx="3" fill="url(#accent)"/>
  <ellipse cx="990" cy="180" rx="460" ry="245" fill="url(#halo)"/>

  <!-- Large title, visually separated from the diagram. -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="58" y="143" fill="#f8fafc" font-size="66" font-weight="800" letter-spacing="2">DMCT</text>
    <path d="M62 168H258" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <text x="60" y="219" fill="#cbd5e1" font-size="24" font-weight="750" letter-spacing="1">LEARNED</text>
    <text x="60" y="254" fill="#cbd5e1" font-size="24" font-weight="750" letter-spacing="1">LOW–HIGH</text>
    <text x="60" y="289" fill="#cbd5e1" font-size="24" font-weight="750" letter-spacing="1">DECOMPOSITION</text>
  </g>
  <path d="M330 48V312" stroke="#93c5fd" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Thermal image. -->
  <g transform="translate(398 105)">
    <rect width="132" height="132" rx="18" fill="#0d2038" stroke="#67e8f9" stroke-opacity="0.74" stroke-width="2"/>
    <rect x="10" y="10" width="112" height="112" rx="12" fill="#101b36"/>
    <ellipse cx="67" cy="70" rx="39" ry="31" fill="url(#heat)" opacity="0.92" filter="url(#blur)"/>
    <path d="M27 74c8-22 21-31 39-29 16 2 24 14 39 12M31 86c11-14 23-20 38-17 13 3 22 10 32 8" fill="none" stroke="#fde68a" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="74" cy="58" r="6" fill="#fff7ad"/>
    <path d="M74 34V48M74 68V82M50 58H64M84 58H98" stroke="#fff7ad" stroke-width="2"/>
  </g>
  <text x="464" y="278" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="750" text-anchor="middle" letter-spacing="1">INPUT</text>

  <!-- Guided frequency decomposition symbol. -->
  <path d="M540 171H594" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(613 94)">
    <rect width="162" height="162" rx="24" fill="#101d34" stroke="url(#accent)" stroke-width="3"/>
    <rect x="23" y="23" width="116" height="116" rx="12" fill="#071322" stroke="#64748b" stroke-opacity="0.7" stroke-width="2"/>
    <g fill="#22d3ee" opacity="0.88">
      <circle cx="39" cy="39" r="4"/><circle cx="65" cy="31" r="3"/><circle cx="97" cy="37" r="4"/><circle cx="123" cy="48" r="3"/>
      <circle cx="31" cy="76" r="3"/><circle cx="130" cy="81" r="4"/><circle cx="42" cy="117" r="4"/><circle cx="117" cy="119" r="3"/>
    </g>
    <rect x="51" y="51" width="60" height="60" rx="9" fill="url(#heat)" opacity="0.96"/>
    <rect x="43" y="43" width="76" height="76" rx="12" fill="none" stroke="#fde68a" stroke-opacity="0.75" stroke-width="2"/>
    <circle cx="81" cy="81" r="9" fill="#fff7ad"/>
  </g>
  <text x="694" y="289" fill="#e0e7ff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">SPLIT</text>

  <!-- Two complementary outputs: smooth structure and fine residual detail. -->
  <path d="M781 175H830V104H884" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M830 175V256H884" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(902 44)">
    <rect width="132" height="132" rx="18" fill="#0d2038" stroke="#c4b5fd" stroke-opacity="0.82" stroke-width="2"/>
    <rect x="10" y="10" width="112" height="112" rx="12" fill="#101b36"/>
    <ellipse cx="66" cy="69" rx="37" ry="28" fill="url(#heat)" opacity="0.9"/>
    <ellipse cx="66" cy="69" rx="24" ry="17" fill="#fde68a" opacity="0.92"/>
    <path d="M31 73c10-17 22-24 36-22 15 1 24 10 35 8" fill="none" stroke="#fff7ad" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1080" y="120" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="1">LOW</text>

  <g transform="translate(902 190)">
    <rect width="132" height="132" rx="18" fill="#0d2038" stroke="#67e8f9" stroke-opacity="0.84" stroke-width="2"/>
    <rect x="10" y="10" width="112" height="112" rx="12" fill="#101b36"/>
    <g fill="#22d3ee">
      <circle cx="24" cy="29" r="3"/><circle cx="47" cy="20" r="2"/><circle cx="73" cy="27" r="3"/><circle cx="106" cy="22" r="2"/>
      <circle cx="116" cy="48" r="3"/><circle cx="20" cy="58" r="2"/><circle cx="31" cy="92" r="3"/><circle cx="51" cy="112" r="2"/>
      <circle cx="81" cy="115" r="3"/><circle cx="108" cy="101" r="2"/><circle cx="117" cy="75" r="3"/>
    </g>
    <path d="M28 83l15-19 12 10 13-29 12 35 12-14 16 18" fill="none" stroke="#fde68a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 96H108M35 106H96" stroke="#fb7185" stroke-opacity="0.48" stroke-width="2"/>
  </g>
  <text x="1080" y="266" fill="#a5f3fc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="1">HIGH</text>

  <!-- Learned emphasis is conveyed by the paired trainable projection/gating motifs. -->
  <path d="M1160 109H1206M1160 255H1206" stroke="#93c5fd" stroke-opacity="0.45" stroke-width="3"/>
  <g transform="translate(1218 75)">
    <rect width="142" height="66" rx="20" fill="#182642" stroke="#c4b5fd" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M24 33H118" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="62" cy="33" r="12" fill="#c4b5fd" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="62" cy="33" r="4" fill="#312e81"/>
  </g>
  <g transform="translate(1218 221)">
    <rect width="142" height="66" rx="20" fill="#182642" stroke="#67e8f9" stroke-opacity="0.82" stroke-width="2"/>
    <path d="M24 33H118" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="91" cy="33" r="12" fill="#67e8f9" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="91" cy="33" r="4" fill="#164e63"/>
  </g>
</svg>
