<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">DMCT final infrared perception results</title>
  <desc id="desc">Paper-reported mIoU scores for small-target detection on NUDT-SIRST, IRSTD-1K, IRSTDID-SKY, overall, and FMB semantic segmentation evaluation settings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="0.55" stop-color="#0c1b31"/>
      <stop offset="1" stop-color="#11152b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93c5fd" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="540" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="540" rx="28" fill="url(#grid)"/>
  <rect x="0" y="0" width="7" height="540" rx="3" fill="url(#cyan)"/>

  <!-- Detection panel -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="30" y="28" width="745" height="484" rx="24" fill="#0d1b30" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="2"/>
    <text x="68" y="91" fill="#f8fafc" font-size="31" font-weight="800" letter-spacing="1">SMALL-TARGET DETECTION</text>
    <text x="68" y="127" fill="#94a3b8" font-size="21" font-weight="650" letter-spacing="1">mIoU (%)</text>

    <text x="68" y="202" fill="#e2e8f0" font-size="24" font-weight="650">NUDT-SIRST</text>
    <rect x="286" y="175" width="340" height="34" rx="17" fill="#17283f"/>
    <rect x="286" y="175" width="324" height="34" rx="17" fill="url(#cyan)"/>
    <text x="704" y="201" text-anchor="end" fill="#f8fafc" font-size="24" font-weight="800">95.26</text>

    <text x="68" y="282" fill="#e2e8f0" font-size="24" font-weight="650">IRSTD-1K</text>
    <rect x="286" y="255" width="340" height="34" rx="17" fill="#17283f"/>
    <rect x="286" y="255" width="226" height="34" rx="17" fill="url(#cyan)"/>
    <text x="704" y="281" text-anchor="end" fill="#f8fafc" font-size="24" font-weight="800">66.40</text>

    <text x="68" y="362" fill="#e2e8f0" font-size="24" font-weight="650">IRSTDID-SKY</text>
    <rect x="286" y="335" width="340" height="34" rx="17" fill="#17283f"/>
    <rect x="286" y="335" width="247" height="34" rx="17" fill="url(#cyan)"/>
    <text x="704" y="361" text-anchor="end" fill="#f8fafc" font-size="24" font-weight="800">72.65</text>

    <path d="M68 400H704" stroke="#64748b" stroke-opacity="0.28" stroke-width="2"/>
    <text x="68" y="461" fill="#bae6fd" font-size="25" font-weight="750">OVERALL</text>
    <text x="704" y="466" text-anchor="end" fill="#67e8f9" font-size="42" font-weight="850">78.10</text>
  </g>

  <!-- Segmentation panel -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="805" y="28" width="765" height="484" rx="24" fill="#11192e" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="2"/>
    <text x="843" y="91" fill="#f8fafc" font-size="31" font-weight="800" letter-spacing="1">FMB SEGMENTATION</text>
    <text x="843" y="127" fill="#94a3b8" font-size="21" font-weight="650" letter-spacing="1">mIoU (%)</text>

    <text x="843" y="202" fill="#e2e8f0" font-size="23" font-weight="650">×2 RESOLUTION</text>
    <rect x="1080" y="175" width="347" height="34" rx="17" fill="#22233d"/>
    <rect x="1080" y="175" width="328" height="34" rx="17" fill="url(#violet)"/>
    <text x="1502" y="201" text-anchor="end" fill="#f8fafc" font-size="24" font-weight="800">52.03</text>

    <text x="843" y="282" fill="#e2e8f0" font-size="23" font-weight="650">×4 RESOLUTION</text>
    <rect x="1080" y="255" width="347" height="34" rx="17" fill="#22233d"/>
    <rect x="1080" y="255" width="322" height="34" rx="17" fill="url(#violet)"/>
    <text x="1502" y="281" text-anchor="end" fill="#f8fafc" font-size="24" font-weight="800">51.13</text>

    <text x="843" y="362" fill="#e2e8f0" font-size="23" font-weight="650">MODERATE STRIPES</text>
    <rect x="1080" y="335" width="347" height="34" rx="17" fill="#22233d"/>
    <rect x="1080" y="335" width="321" height="34" rx="17" fill="url(#violet)"/>
    <text x="1502" y="361" text-anchor="end" fill="#f8fafc" font-size="24" font-weight="800">50.93</text>

    <text x="843" y="442" fill="#e2e8f0" font-size="23" font-weight="650">SEVERE STRIPES</text>
    <rect x="1080" y="415" width="347" height="34" rx="17" fill="#22233d"/>
    <rect x="1080" y="415" width="319" height="34" rx="17" fill="url(#violet)"/>
    <text x="1502" y="441" text-anchor="end" fill="#f8fafc" font-size="24" font-weight="800">50.56</text>
  </g>
</svg>
