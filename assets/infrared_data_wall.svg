 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43b7ff"/><stop offset="1" stop-color="#5577ff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#1265b8" stop-opacity=".3"/><stop offset="1" stop-color="#1265b8" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#77a9e8" stroke-opacity=".035" stroke-width="1"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#020711" flood-opacity=".4"/></filter>
