<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
<title id="title">DMCT infrared data wall and perception results</title>
<desc id="desc">A large wall of real infrared samples from HM-TIR, infrared small-target benchmarks, and FMB, connected through DMCT to depth estimation, target detection, and semantic segmentation examples.</desc>
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#0b1728"/><stop offset="1" stop-color="#111d31"/></linearGradient>
